```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Open Surprise ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="noise"></div>

  <!-- صفحه اول -->
  <section class="intro" id="intro">

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <div class="intro-content">

      <p class="eyebrow">
        A little something for you
      </p>

      <h1>
        OPEN
        <span>SURPRISE</span>
      </h1>

      <p class="intro-text">
        There is something waiting for you.<br>
        Take a breath... and open it.
      </p>

      <button id="openBtn" class="open-btn">
        <span>OPEN SURPRISE</span>
        <b>↗</b>
      </button>

      <p class="hint">
        tap to reveal
      </p>

    </div>

  </section>


  <!-- صفحه سورپرایز -->
  <section class="surprise" id="surprise">

    <div id="hearts"></div>

    <div class="content">

      <p class="eyebrow">
        JUST FOR YOU ✦
      </p>

      <!-- عکس -->
      <div class="photo-container">

        <div class="photo-glow"></div>

        <img
          src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=800&q=85"
          alt="Our memory"
        >

      </div>


      <div class="message">

        <p class="small-title">
          I HAVE SOMETHING TO TELL YOU...
        </p>

        <h2>
          You make ordinary
          <br>
          <em>moments</em>
          feel special.
        </h2>

        <p id="typedMessage" class="typed"></p>

      </div>


      <!-- موزیک -->
      <button id="musicBtn" class="music-btn">

        <span class="music-icon">
          ♫
        </span>

        <span id="musicText">
          PLAY OUR SONG
        </span>

      </button>


      <p class="final-note">
        Made with a little love, just for you ♡
      </p>

    </div>

  </section>


  <audio id="music" src="music/surprise.mp3"></audio>

  <script src="script.js"></script>

</body>
</html>
```
